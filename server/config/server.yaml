server:
  httpPort: 8083
  grpcPort: 19090
  externalIP: ""

database:
  host: localhost
  port: 5432
  user: aegis_user
  password: your_db_password
  dbname: aegis_db
  sslmode: disable
  maxOpenConns: 25
  maxIdleConns: 10
  connMaxLifetime: 300

redis:
  host: localhost
  port: 6379
  password: your_redis_password
  db: 0
  poolSize: 20

minio:
  endpoint: localhost:9000
  accessKey: minio_admin
  secretKey: your_minio_password
  useSSL: false
  buckets:
    - aegis-templates
    - agent-artifacts
    - generated-scripts

kafka:
  brokers:
    - localhost:9092
  groupId: aegis-server-consumer

log:
  level: info
  filename: server.log
  maxSize: 100