syntax = "proto3";

package agent_comm.v1;

option go_package = "baseline-system/pkg/api/v1";

service AgentService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc ExecuteCommand(stream CommandRequest) returns (stream CommandResult);
}

message RegisterRequest {
    string host_id = 1;
    AssetInfo asset_info = 2;
    string auth_token = 3;
}

message RegisterResponse {
    bool success = 1;
    string host_id = 2;
    string message = 3;
}

message AssetInfo {
    string ip_address = 1;
    string hostname = 2;
    string os_type = 3;
    string os_version = 4;
    string arch = 5;
    string agent_version = 6;
}

message HeartbeatRequest {
    string host_id = 1;
    int64 timestamp = 2;
}

message HeartbeatResponse {
    bool success = 1;
    string message = 2;
}

message CommandRequest {
    oneof request {
        CommandExecute execute = 1;
        CommandResult result = 2;
    }
}

message CommandExecute {
    string task_id = 1;
    string rule_id = 2;
    string host_id = 3;
    string script_content = 4;
    int32 timeout_seconds = 5;
}

message CommandResult {
    string task_id = 1;
    string host_id = 2;
    int32 exit_code = 3;
    string stdout = 4;
    string stderr = 5;
    bool is_final = 6;
}