title: High Risk Outbound TCP Port
id: aegis-network-high-risk-port
status: experimental
description: Detects outbound TCP connections to known high-risk ports
logsource:
  product: linux
  category: network_connection
detection:
  selection:
    DestinationPort:
      - 4444
      - 5555
      - 31337
      - 1234
      - 8443
      - 8081
    network.transport: tcp
  filter_local:
    DestinationIp|startswith:
      - '127.'
      - '::1'
  condition: selection and not filter_local
level: high
tags:
  - attack.t1043
