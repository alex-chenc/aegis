title: System Binary Directory Write
id: aegis-file-system-binary-write
status: experimental
description: Detects write operations to system binary directories
logsource:
  product: linux
  category: file_event
detection:
  selection_path:
    TargetFilename|startswith:
      - '/usr/bin/'
      - '/usr/sbin/'
      - '/bin/'
      - '/sbin/'
  selection_action:
    event.action:
      - open_write
      - create
      - truncate
      - rename
  condition: selection_path and selection_action
level: high
tags:
  - attack.t1547
