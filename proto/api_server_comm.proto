syntax = "proto3";

package api_server_comm.v1;

option go_package = "api-server/pkg/api/v1;pb";

// ============================================================
// API Server ↔ Server gRPC Communication Protocol
// Version: 5.5
// Description: 定义 API Server 与 Server 之间的 gRPC 通信接口
// ============================================================

// APIServerToServer 服务定义
// API Server 作为 gRPC 客户端调用 Server
service APIServerToServer {
    // ForwardCommand 转发命令到Agent
    rpc ForwardCommand(ForwardCommandRequest) returns (ForwardCommandResponse);

    // ExecuteTool 同步执行工具并等待结果
    rpc ExecuteTool(ToolExecuteRequest) returns (ToolExecuteResponse);

    // GetAgentStatus 获取单个Agent状态
    rpc GetAgentStatus(GetAgentStatusRequest) returns (GetAgentStatusResponse);

    // ListConnectedAgents 列出所有已连接的Agent
    rpc ListConnectedAgents(ListConnectedAgentsRequest) returns (ListConnectedAgentsResponse);

    // HealthCheck 健康检查
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

    // UpdateAgentRules 更新Agent的Sigma规则
    rpc UpdateAgentRules(UpdateAgentRulesRequest) returns (UpdateAgentRulesResponse);

    // ExecuteBlockCommand 执行阻断命令
    rpc ExecuteBlockCommand(ExecuteBlockCommandRequest) returns (ExecuteBlockCommandResponse);

    // CollectSoftware 收集主机软件清单
    rpc CollectSoftware(CollectSoftwareRequest) returns (CollectSoftwareResponse);

    // V5.8 Detection Package Management
    rpc InstallDetectionPackage(InstallDetectionPackageRequest) returns (InstallDetectionPackageResponse);
    rpc UninstallDetectionPackage(UninstallDetectionPackageRequest) returns (UninstallDetectionPackageResponse);
    rpc SyncAgentConfig(SyncAgentConfigRequest) returns (SyncAgentConfigResponse);
    rpc ReportDetectionPackageStatus(ReportDetectionPackageStatusRequest) returns (ReportDetectionPackageStatusResponse);
    rpc ReportCorrelationAlert(ReportCorrelationAlertRequest) returns (ReportCorrelationAlertResponse);
}

// ============================================================
// ForwardCommand - 命令转发
// ============================================================

message ForwardCommandRequest {
    string task_id = 1;           // 任务ID
    string host_id = 2;           // 目标主机ID
    string rule_id = 3;           // 规则ID（可选）
    string script_content = 4;    // 脚本内容
    int32 timeout_seconds = 5;    // 超时时间（秒）
    string task_type = 6;         // 任务类型: CHECK, FIX, VULNERABILITY_FIX, POC_VERIFY
}

message ForwardCommandResponse {
    bool success = 1;
    string message = 2;
    string task_id = 3;
}

// ============================================================
// ExecuteTool - 同步执行工具并等待结果
// ============================================================

message ToolExecuteRequest {
    string call_id = 1;
    string host_id = 2;           // 目标主机ID
    string tool = 3;              // 工具名称
    string arguments = 4;         // JSON格式参数
    int32 timeout_seconds = 5;    // 超时时间（秒）
}

message ToolExecuteResponse {
    string call_id = 1;
    bool success = 2;
    string result = 3;            // JSON格式结果
    string error = 4;
    int64 execution_time_ms = 5;  // 执行时间
}

// ============================================================
// GetAgentStatus - 获取Agent状态
// ============================================================

message GetAgentStatusRequest {
    string host_id = 1;           // 主机ID
}

message GetAgentStatusResponse {
    bool connected = 1;           // 是否连接
    string host_id = 2;
    string hostname = 3;
    string ip_address = 4;
    string os_type = 5;
    string agent_version = 6;
    int64 last_heartbeat = 7;     // Unix timestamp
    int32 pending_commands = 8;   // 待处理命令数
}

// ============================================================
// ListConnectedAgents - 列出已连接的Agent
// ============================================================

message ListConnectedAgentsRequest {
    int32 page = 1;               // 页码（从1开始）
    int32 page_size = 2;          // 每页大小
    string status_filter = 3;     // 状态过滤: all, online, offline
}

message ListConnectedAgentsResponse {
    repeated AgentInfo agents = 1;
    int32 total = 2;
    int32 online_count = 3;
    int32 offline_count = 4;
}

message AgentInfo {
    string host_id = 1;
    string hostname = 2;
    string ip_address = 3;
    string os_type = 4;
    string os_version = 5;
    string agent_version = 6;
    string arch = 7;
    bool connected = 8;
    int64 last_heartbeat = 9;
    int64 registered_at = 10;
}

// ============================================================
// HealthCheck - 健康检查
// ============================================================

message HealthCheckRequest {
    string service = 1;           // 服务名称
}

message HealthCheckResponse {
    bool healthy = 1;
    string status = 2;            // running, degraded, unhealthy
    string message = 3;
    map<string, string> details = 4;  // 详细信息
}

// ============================================================
// UpdateAgentRules - 更新Agent规则
// ============================================================

message UpdateAgentRulesRequest {
    string host_id = 1;           // 目标主机ID（空表示所有Agent）
    string action = 2;            // full_sync, incremental
    repeated AgentRuleUpdate rules = 3;
}

message AgentRuleUpdate {
    string rule_id = 1;
    string action = 2;            // add, update, delete
    string content = 3;           // YAML格式Sigma规则
}

message UpdateAgentRulesResponse {
    bool success = 1;
    int32 affected_agents = 2;
    string message = 3;
}

// ============================================================
// ExecuteBlockCommand - 执行阻断命令
// ============================================================

message ExecuteBlockCommandRequest {
    string command_id = 1;        // 命令ID
    string host_id = 2;           // 目标主机ID
    string action = 3;            // kill_process, block_network, etc.
    string target = 4;            // 目标（PID、IP等）
    string reason = 5;            // 阻断原因
    string alert_id = 6;          // 关联告警ID
}

message ExecuteBlockCommandResponse {
    string command_id = 1;
    bool success = 2;
    string error = 3;
    int64 executed_at = 4;        // 执行时间戳
}

// ============================================================
// CollectSoftware - 收集主机软件清单
// ============================================================

message CollectSoftwareRequest {
    string host_id = 1;           // 主机ID
}

message CollectSoftwareResponse {
    bool success = 1;
    string software_json = 2;      // JSON格式的软件列表
    string error = 3;
}

// ============================================================
// 事件通知 (Server -> API Server via callback/webhook)
// ============================================================

// CommandResultNotification 命令执行结果通知
message CommandResultNotification {
    string task_id = 1;
    string host_id = 2;
    int32 exit_code = 3;
    string stdout = 4;
    string stderr = 5;
    bool is_final = 6;
    int64 timestamp = 7;
}

// AgentStatusChangeNotification Agent状态变更通知
message AgentStatusChangeNotification {
    string host_id = 1;
    string hostname = 2;
    string previous_status = 3;   // online, offline
    string current_status = 4;
    int64 timestamp = 5;
}

// ============================================================
// V5.8 Detection Package Messages
// ============================================================

message DetectionPackageCommandRequest {
    string command_id = 1;
    string action = 2;           // install, uninstall, disable
    string package_id = 3;
    string version = 4;
    string package_url = 5;
    string signature_url = 6;
    int64 package_size = 7;
    bool rollback = 8;
}

message InstallDetectionPackageRequest {
    string host_id = 1;          // empty means all online agents
    DetectionPackageCommandRequest command = 2;
}

message InstallDetectionPackageResponse {
    bool success = 1;
    int32 affected_agents = 2;
    string message = 3;
}

message UninstallDetectionPackageRequest {
    string host_id = 1;
    string package_id = 2;
    string version = 3;
}

message UninstallDetectionPackageResponse {
    bool success = 1;
    int32 affected_agents = 2;
    string message = 3;
}

message SyncAgentConfigRequest {
    string host_id = 1;          // empty means all online agents
    repeated AgentConfig configs = 2;
}

message AgentConfig {
    string config_type = 1;
    string config_json = 2;
}

message SyncAgentConfigResponse {
    bool success = 1;
    int32 affected_agents = 2;
    string message = 3;
}

message DetectionPackageHostStatus {
    string host_id = 1;
    string package_id = 2;
    string version = 3;
    string status = 4;
    string active_artifact = 5;  // ringbuf, perf
    repeated string loaded_hooks = 6;
    string error_message = 7;
    int64 reported_at = 8;
}

message ReportDetectionPackageStatusRequest {
    repeated DetectionPackageHostStatus statuses = 1;
}

message ReportDetectionPackageStatusResponse {
    bool success = 1;
    string message = 2;
}

// ============================================================
// V5.8 Correlation Alert Messages
// ============================================================

message ReportCorrelationAlertRequest {
    string agent_id = 1;
    string package_id = 2;
    string correlation_rule_id = 3;
    string severity = 4;
    string evidence_chain_json = 5;
    string event_data_json = 6;
}

message ReportCorrelationAlertResponse {
    bool accepted = 1;
}
