syntax = "proto3";

package agent_comm.v1;

option go_package = "aegis-system/pkg/api/v1;pb";

// AssetInfo 资产信息
message AssetInfo {
  string ip_address = 1;
  string hostname = 2;
  string os_type = 3;
  string os_version = 4;
  string arch = 5;
  string agent_version = 6;
}

// RegisterRequest 注册请求
message RegisterRequest {
  string host_id = 1;
  AssetInfo asset_info = 2;
  string auth_token = 3;
}

// RegisterResponse 注册响应
message RegisterResponse {
  bool success = 1;
  string host_id = 2;
  string message = 3;
}

// HeartbeatRequest 心跳请求
message HeartbeatRequest {
  string host_id = 1;
  int64 timestamp = 2;
}

// HeartbeatResponse 心跳响应
message HeartbeatResponse {
  bool success = 1;
  string message = 2;
}

// CommandExecute 命令执行
message CommandExecute {
  string task_id = 1;
  string rule_id = 2;
  string host_id = 3;
  string script_content = 4;
  int32 timeout_seconds = 5;
}

// CommandResult 命令结果
message CommandResult {
  string task_id = 1;
  string host_id = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  bool is_final = 6;
}

// CommandRequest 命令请求
message CommandRequest {
  oneof request {
    CommandExecute execute = 1;
    CommandResult result = 2;
    RuleUpdateRequest rule_update = 3;
    BlockCommand block = 4;
  }
}

// SoftwareListRequest 软件列表采集请求
message SoftwareListRequest {
  // 可包含扫描参数
}

// SoftwareInfo 软件信息
message SoftwareInfo {
  string name = 1;
  string version = 2;
  string package_manager = 3; // "rpm" or "dpkg"
  string architecture = 4;
}

// SoftwareListResponse 软件列表采集响应
message SoftwareListResponse {
  repeated SoftwareInfo software_list = 1;
}

// === V5.0 新增消息 ===

// RuntimeEvent 运行时事件
message RuntimeEvent {
  string event_id = 1;
  string host_id = 2;
  string hostname = 3;
  int64 timestamp = 4;
  string event_type = 5;      // process_exec, file_access, network_connect, privilege_change
  string process_name = 6;
  int32 pid = 7;
  int32 ppid = 8;
  int32 uid = 9;
  string command_line = 10;
  string file_path = 11;
  string remote_addr = 12;
  string matched_rule_id = 13;
  string mitre_id = 14;
  string severity = 15;
  string process_tree = 16;   // JSON格式的进程树，Agent检测到威胁时自动采集
}

// ReportEventRequest 事件上报请求
message ReportEventRequest {
  string host_id = 1;
  repeated RuntimeEvent events = 2;
}

// ReportEventResponse 事件上报响应
message ReportEventResponse {
  bool success = 1;
  int32 received_count = 2;
}

// ToolRequest 工具调用请求
message ToolRequest {
  string call_id = 1;
  string host_id = 2;
  string tool = 3;             // get_process_tree, get_network_connections, etc.
  string params_json = 4;      // JSON格式参数
}

// ToolResponse 工具调用响应
message ToolResponse {
  string call_id = 1;
  bool success = 2;
  string result_json = 3;      // JSON格式结果
  string error = 4;
}

// RuleUpdate 规则更新
message RuleUpdate {
  string rule_id = 1;
  string action = 2;           // add, update, delete
  string content = 3;          // YAML格式Sigma规则
}

// RuleUpdateRequest 规则更新请求
message RuleUpdateRequest {
  string action = 1;           // full_sync, incremental
  repeated RuleUpdate rules = 2;
}

// RuleUpdateResponse 规则更新响应
message RuleUpdateResponse {
  bool success = 1;
  int32 loaded_count = 2;
  repeated RuleUpdate rules = 3;
}

// BlockCommand 阻断指令
message BlockCommand {
  string command_id = 1;
  string host_id = 2;
  string action = 3;           // kill_process
  string target = 4;           // PID
  string reason = 5;
}

// BlockResponse 阻断响应
message BlockResponse {
  string command_id = 1;
  bool success = 2;
  string error = 3;
}

// AgentService Agent服务
service AgentService {
  // Register 注册Agent
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Heartbeat 心跳
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // ExecuteCommand 执行命令(双向流)
  rpc ExecuteCommand(stream CommandRequest) returns (stream CommandRequest);
  // CollectSoftwareList 采集软件列表
  rpc CollectSoftwareList(SoftwareListRequest) returns (SoftwareListResponse);

  // ReportEvent 运行时事件上报
  rpc ReportEvent(ReportEventRequest) returns (ReportEventResponse);
  // ExecuteTool 工具调用
  rpc ExecuteTool(ToolRequest) returns (ToolResponse);
  // UpdateRules 规则更新
  rpc UpdateRules(RuleUpdateRequest) returns (RuleUpdateResponse);
  // ExecuteBlockCommand 执行阻断指令
  rpc ExecuteBlockCommand(BlockCommand) returns (BlockResponse);
}
