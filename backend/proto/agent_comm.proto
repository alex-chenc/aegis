syntax = "proto3";

package agent_comm;

import "google/protobuf/timestamp.proto";

option go_package = "./agent_comm";

// AgentService 定义 Agent 与服务端之间的 gRPC 服务
service AgentService {
  // Register 首次注册 Agent，并建立双向流通道用于后续通讯
  rpc Register(stream AgentMessage) returns (stream ServerMessage);
}

// ServerMessage 定义服务端下发给 Agent 的消息
message ServerMessage {
  string message_id = 1; // 消息唯一ID
  google.protobuf.Timestamp timestamp = 2; // 消息发送时间

  oneof payload {
    ServerCommand command = 3;               // 下发指令
    HeartbeatResponse heartbeat_response = 4; // 心跳响应
  }
}

// AgentMessage 定义 Agent 上报给服务端的消息
message AgentMessage {
  string host_id = 1;    // Agent 所在主机ID (由 Agent 本地生成并持久化)
  string message_id = 2; // 消息唯一ID
  google.protobuf.Timestamp timestamp = 3; // 消息发送时间

  oneof payload {
    HeartbeatRequest heartbeat_request = 4; // 心跳请求
    AssetInfo asset_info = 5;               // 资产信息
    CommandResult command_result = 6;       // 指令执行结果
  }
}

// ServerCommand 定义具体的指令内容
message ServerCommand {
  string command_id = 1;      // 指令唯一ID
  CommandType type = 2;       // 指令类型
  string script_content = 3;  // 脚本内容 (仅当 type 为 EXEC_SCRIPT 时有效)
  int64 timeout_seconds = 4;  // 脚本执行超时时间
}

enum CommandType {
  EXEC_SCRIPT = 0;   // 执行 Shell 脚本
  COLLECT_ASSET = 1; // 触发一次全量资产收集
  UPDATE_AGENT = 2;  // (预留) Agent 自我更新
}

// CommandResult 定义指令执行的结果
message CommandResult {
  string command_id = 1;          // 对应指令的ID
  CommandStatus status = 2;       // 任务最终状态
  int32 exit_code = 3;            // 退出码 (仅对脚本执行有效)
  string message = 4;             // 附加消息，例如错误详情
  repeated LogEntry log_entries = 5; // 实时日志通过独立的流式字段传输
}

message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  LogStream stream = 2; // STDOUT or STDERR
  string line = 3;      // 日志行内容
}

enum LogStream {
  STDOUT = 0;
  STDERR = 1;
}

enum CommandStatus {
  RUNNING = 0;
  SUCCESS = 1;
  FAILED = 2;
  TIMEOUT = 3;
}

// HeartbeatRequest 定义 Agent 定时上报的心跳信息
message HeartbeatRequest {
  string agent_version = 1;      // Agent 版本
  float cpu_load_1min = 2;       // 1分钟平均CPU负载
  float mem_usage_percent = 3;   // 内存使用百分比
}

// HeartbeatResponse 定义心跳响应 (可用于下发轻量级配置)
message HeartbeatResponse {
  // 目前为空，未来可扩展
}

// AssetInfo 定义主机的完整资产信息
message AssetInfo {
  string hostname = 1;          // 主机名
  string ip_address = 2;        // 主 IP 地址
  string os_name = 3;           // 操作系统名称
  string os_version = 4;        // 操作系统版本
  string kernel_version = 5;    // 内核版本
  string arch = 6;              // 系统架构 (e.g., x86_64, aarch64)
  CPUInfo cpu_info = 7;         // CPU 信息
  MemoryInfo memory_info = 8;   // 内存信息
  repeated DiskInfo disk_info = 9;              // 磁盘信息列表
  repeated NetworkInterface network_interfaces = 10; // 网络接口列表
  repeated InstalledPackage installed_packages = 11; // 已安装软件包列表
  repeated RunningService running_services = 12;     // 运行中的服务列表
  google.protobuf.Timestamp collected_at = 13;       // 资产收集时间
}

// CPUInfo 定义 CPU 信息
message CPUInfo {
  string model_name = 1;  // CPU 型号
  int32 cores = 2;        // 物理核心数
  int32 threads = 3;      // 逻辑线程数
  float frequency_mhz = 4; // CPU 主频 (MHz)
}

// MemoryInfo 定义内存信息
message MemoryInfo {
  int64 total_bytes = 1;  // 总内存 (字节)
  int64 free_bytes = 2;   // 可用内存 (字节)
  int64 used_bytes = 3;   // 已用内存 (字节)
}

// DiskInfo 定义磁盘分区信息
message DiskInfo {
  string device = 1;       // 设备路径 (e.g., /dev/sda1)
  string mount_point = 2;  // 挂载点
  string fs_type = 3;      // 文件系统类型
  int64 total_bytes = 4;   // 总容量 (字节)
  int64 free_bytes = 5;    // 可用容量 (字节)
  int64 used_bytes = 6;    // 已用容量 (字节)
}

// NetworkInterface 定义网络接口信息
message NetworkInterface {
  string name = 1;          // 接口名称 (e.g., eth0)
  string mac_address = 2;   // MAC 地址
  repeated string ip_addresses = 3; // IP 地址列表 (支持多 IP)
  bool is_up = 4;           // 接口是否启用
}

// InstalledPackage 定义已安装软件包信息
message InstalledPackage {
  string name = 1;    // 软件包名
  string version = 2; // 版本号
  string arch = 3;    // 架构
}

// RunningService 定义运行中的系统服务信息
message RunningService {
  string name = 1;       // 服务名称
  string status = 2;     // 服务状态 (e.g., active, inactive)
  string start_mode = 3; // 启动模式 (e.g., enabled, disabled)
}
