title: Suspicious Reverse Shell Command
id: aegis-reverse-shell-001
status: experimental
description: Detects common reverse shell patterns in command line
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    commandline|contains:
      - '/bin/bash -i'
      - 'nc -e'
      - '/dev/tcp/'
      - 'python -c ''import socket'
      - 'perl -e ''use Socket'
      - 'ruby -rsocket'
      - 'php -r ''$sock=fsockopen'
  condition: selection
level: critical
tags:
  - attack.t1059.004
  - attack.execution
---
title: Suspicious Privilege Escalation Commands
id: aegis-privesc-001
status: experimental
description: Detects privilege escalation related commands
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    commandline|contains:
      - 'find / -perm -4000'
      - 'find / -perm -2000'
      - 'sudo -l'
      - 'cat /etc/sudoers'
      - 'pkexec'
  condition: selection
level: high
tags:
  - attack.t1548
  - attack.privilege_escalation
---
title: Credential Access Commands
id: aegis-credential-001
status: experimental
description: Detects credential dumping related commands
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    commandline|contains:
      - 'cat /etc/shadow'
      - 'cat /etc/passwd'
      - '/etc/shadow'
      - 'unshadow'
      - 'john '
      - 'hashcat '
  condition: selection
level: critical
tags:
  - attack.t1003
  - attack.credential_access
---
title: Persistence via Cron Modification
id: aegis-persistence-001
status: experimental
description: Detects cron modification attempts
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    commandline|contains:
      - 'crontab -'
      - '/etc/cron'
      - '/var/spool/cron'
  condition: selection
level: high
tags:
  - attack.t1053
  - attack.persistence
---
title: Defense Evasion Log Deletion
id: aegis-evasion-001
status: experimental
description: Detects log file deletion attempts
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    commandline|contains:
      - 'rm /var/log'
      - 'rm -f /var/log'
      - '> /var/log'
      - 'history -c'
      - 'history -d'
      - 'unset HISTFILE'
  condition: selection
level: high
tags:
  - attack.t1070
  - attack.defense_evasion