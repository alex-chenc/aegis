server:
  http_port: 8080
  grpc_port: 9090
  external_ip: ""

database:
  host: localhost
  port: 5432
  user: aegis_user
  password: your_db_password
  dbname: aegis_db
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300

redis:
  host: localhost
  port: 6379
  password: your_redis_password
  db: 0
  pool_size: 20

minio:
  endpoint: localhost:9000
  access_key: minio_admin
  secret_key: your_minio_password
  use_ssl: false
  buckets:
    - aegis-templates
    - agent-artifacts
    - generated-scripts

llm:
  timeout_seconds: 300
  max_retries: 3

agent:
  auth_token: your_agent_token
  heartbeat_timeout_seconds: 90
  script_timeout_seconds: 300

self_healing:
  max_retries: 3
  enabled: true

kafka:
  brokers:
    - kafka:9092
  group_id: aegis-backend-consumer
