version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baseline_backend
    restart: always
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:${BACKEND_HTTP_PORT:-8080}"
      - "9091:${BACKEND_GRPC_PORT:-9090}"
    depends_on:
      postgres: 
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AGENT_AUTH_TOKEN=${AGENT_AUTH_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - SERVER_PUBLIC_IP=${SERVER_PUBLIC_IP}
      - BACKEND_HTTP_PORT=${BACKEND_HTTP_PORT:-8080}
      - BACKEND_GRPC_PORT=${BACKEND_GRPC_PORT:-9090}
    networks:
      - baseline-net

  agent1:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: agent1
    restart: always
    depends_on:
      - backend
    environment:
      - SERVER_ADDR=backend:${BACKEND_GRPC_PORT:-9090}
    networks:
      - baseline-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: baseline_frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - baseline-net

  postgres:
    build:
      context: ./data
      dockerfile: Dockerfile
    container_name: baseline_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baseline-net

  redis:
    image: redis:7-alpine
    container_name: baseline_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baseline-net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: baseline_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - baseline-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  baseline-net:
    driver: bridge