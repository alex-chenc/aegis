# docker-compose.yml
# Aegis V5.5 微服务架构 - 容器编排配置

version: "3.8"

services:
  # ============================================================
  # 基础设施层
  # ============================================================

  # PostgreSQL 关系型数据库
  postgres:
    image: postgres:14-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis_db
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-a_strong_db_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "log_statement=mod"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegis_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 高速缓存
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-a_strong_redis_password}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--tcp-keepalive"
      - "60"
      - "--timeout"
      - "300"
      - "--databases"
      - "4"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-a_strong_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-a_third_strong_secret_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Kafka 依赖的 Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aegis-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka 消息队列
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aegis-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:9092"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # MinIO 初始化容器（一次性运行，创建 Bucket）
  minio-init:
    image: minio/mc:latest
    container_name: aegis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb myminio/aegis-templates --ignore-existing;
      mc mb myminio/agent-artifacts --ignore-existing;
      mc mb myminio/generated-scripts --ignore-existing;
      mc anonymous set download myminio/agent-artifacts;
      echo 'MinIO initialization complete.';
      exit 0;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-a_third_strong_secret_password}
    networks:
      - aegis-network

  # ============================================================
  # 应用层 - 微服务
  # ============================================================

  # API Server (HTTP REST + gRPC客户端)
  api-server:
    build: ./api-server
    container_name: aegis-api-server
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 223.5.5.5
    dns_search:
      - .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # 数据库配置
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: aegis_user
      DATABASE_PASSWORD: ${DB_PASSWORD:-a_strong_db_password}
      DATABASE_DBNAME: aegis_db
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: 25
      DATABASE_MAX_IDLE_CONNS: 10
      DATABASE_CONN_MAX_LIFETIME: 300
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-a_strong_redis_password}
      REDIS_DB: 0
      REDIS_POOL_SIZE: 20
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-a_third_strong_secret_password}
      MINIO_USE_SSL: "false"
      # 服务配置
      SERVER_HTTP_PORT: 8082
      SERVER_GRPC_PORT: 19093
      AGENT_HUB_PORT: 19090
      SERVER_EXTERNAL_IP: ${EXTERNAL_IP:-}
      GRPC_SERVER_ADDRESS: server:19094
      # Agent 配置
      AGENT_AUTH_TOKEN: ${AGENT_TOKEN:-a_very_secret_agent_token}
      # Kafka 配置
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: aegis-api-server-consumer
    ports:
      - "8082:8082"
      - "19093:19093"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Server (gRPC Agent Hub + Kafka Producer)
  server:
    build: ./server
    container_name: aegis-server
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 223.5.5.5
    dns_search:
      - .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # 数据库配置
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: aegis_user
      DATABASE_PASSWORD: ${DB_PASSWORD:-a_strong_db_password}
      DATABASE_DBNAME: aegis_db
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: 25
      DATABASE_MAX_IDLE_CONNS: 10
      DATABASE_CONN_MAX_LIFETIME: 300
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-a_strong_redis_password}
      REDIS_DB: 0
      REDIS_POOL_SIZE: 20
      # Kafka 配置
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: aegis-server-consumer
      # Server gRPC 配置
      SERVER_GRPC_PORT: 19090
      SERVER_EXTERNAL_IP: ${EXTERNAL_IP:-}
      SERVER_EXTERNAL_GRPC_PORT: 19090
      # Agent 配置
      AGENT_AUTH_TOKEN: ${AGENT_TOKEN:-a_very_secret_agent_token}
      AGENT_HEARTBEAT_TIMEOUT: 90
      AGENT_SCRIPT_TIMEOUT: 300
    ports:
      - "19090:19090"
      - "19094:19094"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19090 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # DC (Data Consumer - Kafka Consumer + LLM Analysis)
  dc:
    build: ./dc
    container_name: aegis-dc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # 数据库配置
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: aegis_user
      DATABASE_PASSWORD: ${DB_PASSWORD:-a_strong_db_password}
      DATABASE_DBNAME: aegis_db
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: 25
      DATABASE_MAX_IDLE_CONNS: 5
      DATABASE_CONN_MAX_LIFETIME: 300
      # Kafka 配置
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: aegis-dc-consumer
      KAFKA_TOPIC: aegis.security.events
      # DC gRPC 配置
      GRPC_SERVER_PORT: 19092
      # LLM 配置
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4}
    ports:
      - "19092:19092"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19092 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Vue 前端 (Nginx)
  frontend:
    build: ./frontend
    container_name: aegis-frontend
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  #     start_period: 10s

# ============================================================
# 网络配置
# ============================================================
networks:
  aegis-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================
# 数据卷配置
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
