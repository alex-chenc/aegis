# docker-compose.yml
# 自动化基线检查与自愈系统 - 容器编排配置
# 版本：V2.0

version: "3.8"

services:
  # ============================================================
  # 基础设施层
  # ============================================================

  # PostgreSQL 关系型数据库
  postgres:
    image: postgres:14-alpine
    container_name: baseline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: baseline_db
      POSTGRES_USER: baseline_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-a_strong_db_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "log_statement=mod"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - baseline-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseline_user -d baseline_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 高速缓存
  redis:
    image: redis:7-alpine
    container_name: baseline-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-a_strong_redis_password}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--tcp-keepalive"
      - "60"
      - "--timeout"
      - "300"
      - "--databases"
      - "4"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - baseline-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-a_strong_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: baseline-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-a_third_strong_secret_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - baseline-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # MinIO 初始化容器（一次性运行，创建 Bucket）
  minio-init:
    image: minio/mc:latest
    container_name: baseline-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb myminio/baseline-templates --ignore-existing;
      mc mb myminio/agent-artifacts --ignore-existing;
      mc mb myminio/generated-scripts --ignore-existing;
      mc anonymous set download myminio/agent-artifacts;
      echo 'MinIO initialization complete.';
      exit 0;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-a_third_strong_secret_password}
    networks:
      - baseline-network

  # ============================================================
  # 应用层
  # ============================================================

  # Go 后端服务
  backend:
    image: baseline-system/backend:latest
    container_name: baseline-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # 数据库配置
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: baseline_user
      DATABASE_PASSWORD: ${DB_PASSWORD:-a_strong_db_password}
      DATABASE_DBNAME: baseline_db
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: 25
      DATABASE_MAX_IDLE_CONNS: 10
      DATABASE_CONN_MAX_LIFETIME: 300
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-a_strong_redis_password}
      REDIS_DB: 0
      REDIS_POOL_SIZE: 20
      # MinIO 配置
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-a_third_strong_secret_password}
      MINIO_USE_SSL: "false"
      # 服务配置
      SERVER_HTTP_PORT: 8080
      SERVER_GRPC_PORT: 9090
      SERVER_EXTERNAL_IP: ${SERVER_PUBLIC_IP:-}
      # Agent 配置
      AGENT_AUTH_TOKEN: ${AGENT_TOKEN:-a_very_secret_agent_token}
      AGENT_HEARTBEAT_TIMEOUT: 90
      AGENT_SCRIPT_TIMEOUT: 300
      # 自愈配置
      SELF_HEALING_MAX_RETRIES: 3
      SELF_HEALING_ENABLED: "true"
    ports:
      - "8080:8080"
      - "19090:9090"
    networks:
      - baseline-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Vue 前端 (Nginx)
  frontend:
    image: baseline-system/frontend:latest
    container_name: baseline-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - baseline-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ============================================================
# 网络配置
# ============================================================
networks:
  baseline-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================
# 数据卷配置
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local